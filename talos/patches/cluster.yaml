# Machine-config patch applied to all nodes at cluster create time.
# Cilium replaces both the default CNI (Flannel) and kube-proxy.
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
  # Expose etcd metrics for Alloy to scrape (etcd is a Talos system service,
  # not a pod, so this is the only way to get its Prometheus endpoint).
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
  # kagent 1.x runs on Agent Substrate, whose workload identity is built on pod
  # certificates. On Kubernetes 1.36 those APIs are still beta and off by
  # default; the substrate chart's install notes list exactly these gates plus
  # the certificates.k8s.io/v1beta1 API (GA from 1.37, when this block can
  # go). Without it a rebuilt cluster cannot run kagent alpha16.
  apiServer:
    extraArgs:
      feature-gates: ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
      runtime-config: certificates.k8s.io/v1beta1=true
  controllerManager:
    extraArgs:
      feature-gates: ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
machine:
  kubelet:
    extraConfig:
      featureGates:
        ClusterTrustBundle: true
        ClusterTrustBundleProjection: true
        PodCertificateRequest: true
