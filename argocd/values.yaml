# Argo CD values. Chart: argo/argo-cd, pinned in apps/argocd.yaml.
# Access is via `kubectl port-forward` only -- no Ingress/LoadBalancer,
# nothing exposed beyond localhost.

dex:
  enabled: false            # no SSO; local admin user only

notifications:
  enabled: false            # not needed yet

applicationSet:
  enabled: false            # app-of-apps uses plain Applications

configs:
  cm:
    # Chart default, minus the Endpoints/EndpointSlice exclusion: the etcd
    # scrape target (manifests/monitoring/etcd-metrics.yaml) is a manually
    # managed Endpoints object, which Argo CD must be able to sync.
    resource.exclusions: |
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
  params:
    server.insecure: false  # keep TLS on the server, even behind port-forward

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
