# Cilium values for Talos (per https://docs.siderolabs.com -> Cilium guide).
# Chart: cilium/cilium, pinned in scripts/cluster-up.sh and apps/cilium.yaml.

ipam:
  mode: kubernetes

# Talos disables kube-proxy (cluster.proxy.disabled: true); Cilium's eBPF
# replacement handles Services instead.
kubeProxyReplacement: true

# KubePrism: Talos runs a local apiserver load balancer on every node at
# localhost:7445, reachable before pod networking exists.
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos requires explicit capabilities instead of privileged agents.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Talos mounts cgroup2 at /sys/fs/cgroup already; don't remount.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

operator:
  # Single replica is enough for a 2-node homelab.
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
