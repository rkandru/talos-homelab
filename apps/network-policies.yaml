# Worked example of Cilium-enforced network policy in the demo namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rkandru/talos-homelab.git
    targetRevision: main
    path: manifests/network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
