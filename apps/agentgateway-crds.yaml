# agentgateway CRDs (AgentgatewayBackend, AgentgatewayPolicy,
# AgentgatewayParameters). Separate chart and separate Application from the
# control plane so CRD establishment cannot race the controller that consumes
# them.
#
# Requires the upstream Gateway API CRDs (apps/gateway-api-crds.yaml, wave -10).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: default
  source:
    repoURL: cr.agentgateway.dev
    chart: charts/agentgateway-crds
    targetRevision: v1.5.0
    helm:
      releaseName: agentgateway-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
