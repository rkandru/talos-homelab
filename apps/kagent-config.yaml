# kagent's routes, authorization policy, network policies, tool server and agent
# identities — everything that is OURS rather than upstream's chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/rkandru/agentic-devops.git
    targetRevision: main
    path: deploy/kagent
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
