# kagent CRDs, separate from the controller chart so CRD establishment cannot
# race the controller that consumes them. Pinned in lockstep with apps/kagent.yaml
# — the v1alpha2 schema is alpha and churns between minors, so an unpinned CRD
# chart against a pinned controller is a real hazard.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent-crds
    targetRevision: 0.9.12
    helm:
      releaseName: kagent-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
