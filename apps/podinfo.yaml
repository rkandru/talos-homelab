# Demo app proving the GitOps loop: edit replicaCount here, push, and
# watch Argo CD reconcile it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.14.0
    helm:
      releaseName: podinfo
      valuesObject:
        replicaCount: 2
        # Scraped by Alloy's annotation autodiscovery (monitoring app) —
        # podinfo's HTTP metrics are the SLI source for its 99.95%
        # availability SLO (see agentic-devops repo, grafana/alerts).
        podAnnotations:
          k8s.grafana.com/scrape: "true"
          k8s.grafana.com/metrics.portNumber: "9898"
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
