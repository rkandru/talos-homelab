# Grafana k8s-monitoring chart (v4) — deploys Grafana Alloy + exporters and
# remote-writes to Grafana Cloud (stack: rahulkandru.grafana.net).
# The write credential lives in the grafana-cloud-metrics Secret (NOT in git);
# see MONITORING.md for how to (re)create it.

# "talos-homelab", not "homelab": another (leftover) sender on this Grafana
# Cloud account pushes cluster="homelab" from Docker Desktop's built-in k8s,
# and the label must distinguish the two.
cluster:
  name: talos-homelab

destinations:
  grafanaCloudMetrics:
    type: prometheus
    url: https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push
    auth:
      type: basic
      usernameKey: username
      passwordKey: password
    secret:
      create: false
      name: grafana-cloud-metrics
      namespace: monitoring

# ============================================================
# K8S METRICS — partial re-enable (2026-07-29) for the agentic
# phase-0 SLO work: kube-state-metrics ONLY (pod restarts, OOM,
# replica drift — needed for crashloop alerts + Holmes context).
# kubelet/cAdvisor/apiserver stay OFF: they are the series-heavy
# sources, and the 15k active-series limit is shared with other
# senders (see issue 7). Watch series usage after any change here.
# The SLO's own signal comes from podinfo's app metrics via
# annotation autodiscovery (annotations set in apps/podinfo.yaml),
# not from cluster metrics.
# ============================================================
clusterMetrics:
  enabled: true
  kubelet:
    enabled: false
  kubeletResource:
    enabled: false
  cadvisor:
    enabled: false
  apiServer:
    enabled: false
  kube-state-metrics:
    enabled: true
    metricsTuning:
      useDefaultAllowList: true

# TALOS METRICS (always on): node-exporter machine metrics — OneUptime's
# node-level CPU/memory/disk/network recommendations all come from it.
# In chart v4 this is a separate feature from clusterMetrics, and the
# linuxHosts source must be enabled explicitly or the feature renders empty.
hostMetrics:
  enabled: true
  linuxHosts:
    enabled: true

# v4 splits exporter *deployment* out from the scrape config above.
telemetryServices:
  kube-state-metrics:
    deploy: true    # part of the K8s metrics toggle above

  node-exporter:
    deploy: true
    # Talos control-plane nodes are tainted; we want machine metrics from
    # every node, control plane included.
    tolerations:
      - operator: Exists
        effect: NoSchedule

# Scrapes anything annotated k8s.grafana.com/scrape=true — used for the etcd
# Service/Endpoints in manifests/monitoring/ (etcd is a Talos system service,
# not a pod, so it can't be discovered any other way).
annotationAutodiscovery:
  enabled: true

collectors:
  alloy-metrics:
    enabled: true
    # Required by annotationAutodiscovery so scrape targets are sharded
    # rather than duplicated if the collector ever scales beyond 1 replica.
    presets: [clustered]
