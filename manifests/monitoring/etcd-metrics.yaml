# etcd runs as a Talos system service (not a pod), listening on the node IP.
# This selector-less Service + manual Endpoints makes it discoverable by
# Alloy's annotation autodiscovery. Requires the machine-config patch that
# sets cluster.etcd.extraArgs.listen-metrics-urls (talos/patches/cluster.yaml).
apiVersion: v1
kind: Service
metadata:
  name: etcd-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: etcd
  annotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/job: "etcd"
    k8s.grafana.com/metrics.portNumber: "2381"
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 2381
      targetPort: 2381
---
apiVersion: v1
kind: Endpoints
metadata:
  name: etcd-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: etcd
subsets:
  - addresses:
      # Docker-provisioner control plane node; IP is stable for this network.
      - ip: 10.5.0.2
        nodeName: homelab-controlplane-1
    ports:
      - name: metrics
        port: 2381
